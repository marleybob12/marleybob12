name: Atualizar onda de contribuições

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate-contribution-wave.mjs"
      - ".github/workflows/contribution-wave.yml"

permissions:
  contents: write

concurrency:
  group: contribution-wave
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preparar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Gerar a onda animada
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: node scripts/generate-contribution-wave.mjs

      - name: Publicar a atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-wave.svg

          if git diff --cached --quiet; then
            echo "A onda já está atualizada."
            exit 0
          fi

          git commit -m "Atualiza onda de contribuições"
          git pull --rebase origin main
          git push
