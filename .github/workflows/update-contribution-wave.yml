name: Atualizar onda de contribuições

on:
  schedule:
    - cron: "15 3 * * *" # todo dia, 03:15 UTC (00:15 em Brasília)
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate-contribution-wave.mjs"
      - ".github/workflows/update-contribution-wave.yml"

permissions:
  contents: write

concurrency:
  group: contribution-wave
  cancel-in-progress: false

jobs:
  update-wave:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Gerar onda com contribuições atuais
        run: node scripts/generate-contribution-wave.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: marleybob12

      - name: Publicar atualização
        run: |
          git add assets/contribution-wave.svg
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: atualiza onda de contribuições [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
