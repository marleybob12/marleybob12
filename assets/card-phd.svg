<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="275" viewBox="0 0 560 275" role="img" aria-label="PHD Escola Virtual, plataforma educacional full-stack">
<title>PHD Escola Virtual, plataforma educacional full-stack</title>
<defs>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#2A2440"/></pattern>
<clipPath id="ccc"><rect x="1" y="1" width="558" height="273" rx="18"/></clipPath>
<linearGradient id="bowlc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6D46D9"/><stop offset="1" stop-color="#3F2C86"/></linearGradient>
<style>
.s{font-family:'Segoe UI','Helvetica Neue',Arial,'DejaVu Sans',sans-serif} .m{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
.bob{animation:bob 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.fl{animation:fl 2.4s ease-in-out infinite}
@keyframes fl{0%,100%{opacity:1}50%{opacity:.2}}
.sq{animation:sq 4.8s ease-in-out infinite}
@keyframes sq{0%,100%{opacity:.25}8%,14%{opacity:1}30%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</defs>
