<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24" role="img" aria-label="Divisor">
<title>Divisor</title>
<defs>
<linearGradient id="st" x1="0" x2="1"><stop offset="0" stop-color="#A78BFA" stop-opacity="0"/><stop offset=".7" stop-color="#A78BFA"/><stop offset="1" stop-color="#FFB454"/></linearGradient>
<style>
.s{font-family:'Segoe UI','Helvetica Neue',Arial,'DejaVu Sans',sans-serif} .m{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</defs>
<rect x="0" y="11" width="1000" height="2" fill="#2A2440"/>
<rect x="-200" y="10" width="200" height="4" rx="2" fill="url(#st)"><animate attributeName="x" values="-200;1000" dur="4.5s" repeatCount="indefinite"/></rect>
</svg>
