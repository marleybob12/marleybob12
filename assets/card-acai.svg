<line x1="30" y1="214" x2="62" y2="214" stroke="#FFB454" stroke-width="2"><animate attributeName="x1" values="30;298;30" dur="5s" repeatCount="indefinite"/><animate attributeName="x2" values="62;330;62" dur="5s" repeatCount="indefinite"/></line>
<text class="m" x="30" y="244" font-size="12" fill="#9A94B5" letter-spacing="1">REACT / VITE / JAVASCRIPT</text>
<clipPath id="bwa"><path d="M375 150 H515 A70 64 0 0 1 375 150 Z"/></clipPath>
<path d="M375 150 H515 A70 64 0 0 1 375 150 Z" fill="url(#bowla)"/>
<g clip-path="url(#bwa)"><rect x="370" y="168" width="150" height="10" fill="#C4B5FD" opacity=".16"/><rect x="370" y="190" width="150" height="10" fill="#C4B5FD" opacity=".10"/></g>
<path d="M375 150 H515 A70 64 0 0 1 375 150 Z" fill="none" stroke="#A78BFA" stroke-width="2"/>
<ellipse cx="445" cy="150" rx="70" ry="9" fill="#0B0A12" stroke="#A78BFA" stroke-width="2"/>
