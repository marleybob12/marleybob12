<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-labelledby="wave-title wave-desc">
  <title id="wave-title">Preparando a onda de contribuições</title>
  <desc id="wave-desc">A visualização será preenchida automaticamente pelo GitHub Actions.</desc>
  <defs>
    <linearGradient id="wave-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B1764" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <style>
      .wave-one { animation: drift-one 8s ease-in-out infinite; }
      .wave-two { animation: drift-two 6s ease-in-out infinite; }
      @keyframes drift-one {
        0%, 100% { transform: translateX(0); opacity: .35; }
        50% { transform: translateX(35px); opacity: .55; }
      }
      @keyframes drift-two {
        0%, 100% { transform: translateX(0); opacity: .25; }
        50% { transform: translateX(-30px); opacity: .45; }
      }
      @media (prefers-reduced-motion: reduce) {
        .wave-one, .wave-two { animation: none; }
      }
    </style>
  </defs>
  <rect x="1" y="1" width="998" height="308" rx="22" fill="#0D1117" stroke="#30363D" />
  <text x="500" y="108" text-anchor="middle" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Preparando sua onda de contribuições</text>
  <text x="500" y="138" text-anchor="middle" fill="#9CA3AF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">O GitHub atualizará os dados automaticamente.</text>
  <path class="wave-one" d="M-90 212 C110 150 280 250 485 205 S820 165 1090 218 V320 H-90 Z" fill="url(#wave-gradient)" />
  <path class="wave-two" d="M-90 245 C120 198 300 268 520 232 S850 198 1090 250 V320 H-90 Z" fill="#6D28D9" />
</svg>
